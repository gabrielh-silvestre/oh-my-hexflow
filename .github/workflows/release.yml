name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag e o Cargo.toml andam juntos: tag errada não vira release.
      - name: Tag matches Cargo.toml
        run: |
          version=$(awk '/^\[/ { s = ($0 == "[workspace.package]") } s && /^version = "/ { gsub(/^version = "|"$/, ""); print; exit }' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version v$version"
            exit 1
          fi

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: musl-tools
        run: sudo apt-get install -y musl-tools

      # Sem cache: o build da release é sempre frio.
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Binary is static
        run: file target/x86_64-unknown-linux-musl/release/omhl | grep -E 'statically linked|static-pie linked'

      - name: Binary reports the tag version
        run: |
          expected="omhl ${GITHUB_REF_NAME#v}"
          actual=$(target/x86_64-unknown-linux-musl/release/omhl --version)
          if [ "$actual" != "$expected" ]; then
            echo "::error::omhl --version printed '$actual', expected '$expected'"
            exit 1
          fi

      - name: Package
        run: |
          tar -czf omhl-x86_64-unknown-linux-musl.tar.gz -C target/x86_64-unknown-linux-musl/release omhl
          sha256sum omhl-x86_64-unknown-linux-musl.tar.gz > omhl-x86_64-unknown-linux-musl.tar.gz.sha256

      # Uma chamada só: release sem os dois arquivos nunca existe.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" omhl-x86_64-unknown-linux-musl.tar.gz omhl-x86_64-unknown-linux-musl.tar.gz.sha256
