name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A execução da main nunca é cancelada: é ela que semeia o cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # O teste de execução do hook agent-role roda o comando reescrito também em zsh.
      - name: zsh
        run: sudo apt-get install -y zsh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        if: ${{ !cancelled() }}
        run: cargo build --workspace --locked

      - name: test
        id: test
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Prova que todo teste listado rodou e passou: a contagem vem da listagem, nunca de grep no código.
      - name: coverage
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        shell: bash
        run: |
          cargo test --workspace --locked -- --list > "$RUNNER_TEMP/list.txt"
          listed=$(grep -c ': test$' "$RUNNER_TEMP/list.txt" || true)
          read -r passed failed ignored < <(awk '/^test result:/ {
            for (i = 1; i < NF; i++) {
              if ($(i + 1) ~ /^passed/) p += $i
              if ($(i + 1) ~ /^failed/) f += $i
              if ($(i + 1) ~ /^ignored/) g += $i
            }
          } END { print p + 0, f + 0, g + 0 }' "$RUNNER_TEMP/test.log")
          echo "listed=$listed passed=$passed failed=$failed ignored=$ignored"
          if [ "$listed" -eq 0 ] || [ "$listed" -ne "$passed" ] || [ "$failed" -ne 0 ] || [ "$ignored" -ne 0 ]; then
            echo "::error::coverage mismatch: listed=$listed passed=$passed failed=$failed ignored=$ignored"
            exit 1
          fi

  # Jobs de medição do perf3 (commit M, temporário): o commit de veredito os remove.
  medicao-t1:
    name: medicao-t1
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Sem rust-cache, o CARGO_INCREMENTAL=0 que ele exporta é posto à mão.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Identificação
        continue-on-error: true
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          echo "github.sha=$GITHUB_SHA"
          echo "HEAD^1=$(git rev-parse HEAD^1)"
          echo "HEAD^2=$(git rev-parse HEAD^2)"
          echo "pull_request.base.sha=$PR_BASE_SHA"
          echo "pull_request.head.sha=$PR_HEAD_SHA"
          echo "runner.name=$RUNNER_NAME"
          findmnt /dev/shm
          env

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # O teste de execução do hook agent-role roda o comando reescrito também em zsh.
      - name: zsh
        run: sudo apt-get install -y zsh

      - name: Compilação única
        run: cargo test --workspace --locked --no-run

      - name: Medição
        shell: bash
        run: |
          set +e
          set -u
          declare -A status_de compiling_de
          validos=0
          total_compiling=0

          mede() {
            local variante=$1 par=$2 ordem=$3
            local log="$RUNNER_TEMP/t1-par${par}-${variante}.log"
            local inicio fim seg compiling soma
            local status=0
            inicio=$(date +%s.%N)
            ( if [ "$variante" = B ]; then export TMPDIR=/dev/shm; fi
              cargo test --workspace --locked --no-fail-fast ) > "$log" 2>&1 || status=$?
            fim=$(date +%s.%N)
            seg=$(awk -v a="$inicio" -v b="$fim" 'BEGIN { printf "%.3f", b - a }')
            compiling=$(grep -cE '^[[:space:]]*Compiling ' "$log" || true)
            soma=$(awk '/finished in/ {
              for (i = 2; i <= NF; i++) if ($(i - 1) == "finished" && $i == "in") { v = $(i + 1); sub(/s$/, "", v); s += v }
            } END { printf "%.2f", s }' "$log")
            echo "MEDICAO t1 par=$par ordem=$ordem variante=$variante seg=$seg status=$status compiling=$compiling soma_finished=$soma"
            if [ "$status" -ne 0 ]; then
              echo "::warning::t1 par=$par variante=$variante terminou com status $status"
              tail -n 40 "$log"
            fi
            status_de[$variante]=$status
            compiling_de[$variante]=$compiling
            total_compiling=$((total_compiling + compiling))
          }

          for par in 1 2 3 4 5; do
            if [ $((par % 2)) -eq 1 ]; then ordem=AB; else ordem=BA; fi
            for variante in "${ordem:0:1}" "${ordem:1:1}"; do
              mede "$variante" "$par" "$ordem"
            done
            if [ "${status_de[A]}" -eq 0 ] && [ "${status_de[B]}" -eq 0 ] \
              && [ "${compiling_de[A]}" -eq 0 ] && [ "${compiling_de[B]}" -eq 0 ]; then
              validos=$((validos + 1))
              echo "MEDICAO_PAR t1 par=$par valido=1"
            else
              echo "MEDICAO_PAR t1 par=$par valido=0"
            fi
          done

          echo "MEDICAO_RESUMO t1 pares_validos=$validos de=5 total_compiling=$total_compiling"
          if [ "$validos" -lt 5 ]; then
            echo "::error::t1 tem $validos pares válidos de 5"
            exit 1
          fi

  medicao-t2:
    name: medicao-t2
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Sem rust-cache, o CARGO_INCREMENTAL=0 que ele exporta é posto à mão.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Identificação
        continue-on-error: true
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          echo "github.sha=$GITHUB_SHA"
          echo "HEAD^1=$(git rev-parse HEAD^1)"
          echo "HEAD^2=$(git rev-parse HEAD^2)"
          echo "pull_request.base.sha=$PR_BASE_SHA"
          echo "pull_request.head.sha=$PR_HEAD_SHA"
          echo "runner.name=$RUNNER_NAME"
          findmnt /dev/shm
          env

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # O teste de execução do hook agent-role roda o comando reescrito também em zsh.
      - name: zsh
        run: sudo apt-get install -y zsh

      - name: Medição
        shell: bash
        run: |
          set +e
          set -u
          declare -A status_de compiling_de
          validos=0

          # A = alvo padrão em ta; B = alvo em tb com CARGO_PROFILE_DEV_DEBUG=line-tables-only.
          compila() {
            local variante=$1 etiqueta=$2
            local log="$RUNNER_TEMP/t2-${etiqueta}-${variante}.log"
            local inicio fim
            status=0
            inicio=$(date +%s.%N)
            ( if [ "$variante" = A ]; then
                export CARGO_TARGET_DIR="$RUNNER_TEMP/ta"
              else
                export CARGO_TARGET_DIR="$RUNNER_TEMP/tb" CARGO_PROFILE_DEV_DEBUG=line-tables-only
              fi
              cargo test --workspace --locked --no-run ) > "$log" 2>&1 || status=$?
            fim=$(date +%s.%N)
            seg=$(awk -v a="$inicio" -v b="$fim" 'BEGIN { printf "%.3f", b - a }')
            compiling=$(grep -cE '^[[:space:]]*Compiling ' "$log" || true)
            if [ "$status" -ne 0 ]; then
              echo "::warning::t2 $etiqueta variante=$variante terminou com status $status"
              tail -n 40 "$log"
            fi
          }

          for variante in A B; do
            compila "$variante" frio
            echo "MEDICAO t2-frio variante=$variante seg=$seg status=$status compiling=$compiling"
            if [ "$status" -ne 0 ]; then
              echo "::error::t2 compilação a frio falhou na variante $variante"
              exit 1
            fi
          done

          for par in 1 2 3 4 5; do
            if [ $((par % 2)) -eq 1 ]; then ordem=AB; else ordem=BA; fi
            for variante in "${ordem:0:1}" "${ordem:1:1}"; do
              find crates -name '*.rs' -exec touch {} +
              compila "$variante" "par${par}"
              echo "MEDICAO t2 par=$par ordem=$ordem variante=$variante seg=$seg status=$status compiling=$compiling"
              status_de[$variante]=$status
              compiling_de[$variante]=$compiling
            done
            # Sem nenhum Compiling o touch não forçou recompilação: a medição não vale.
            if [ "${status_de[A]}" -eq 0 ] && [ "${status_de[B]}" -eq 0 ] \
              && [ "${compiling_de[A]}" -gt 0 ] && [ "${compiling_de[B]}" -gt 0 ]; then
              validos=$((validos + 1))
              echo "MEDICAO_PAR t2 par=$par valido=1"
            else
              echo "MEDICAO_PAR t2 par=$par valido=0"
            fi
          done

          echo "MEDICAO t2-du alvo=A tamanho=$(du -sh "$RUNNER_TEMP/ta" | cut -f1)"
          echo "MEDICAO t2-du alvo=B tamanho=$(du -sh "$RUNNER_TEMP/tb" | cut -f1)"
          echo "MEDICAO_RESUMO t2 pares_validos=$validos de=5"
          if [ "$validos" -lt 5 ]; then
            echo "::error::t2 tem $validos pares válidos de 5"
            exit 1
          fi
