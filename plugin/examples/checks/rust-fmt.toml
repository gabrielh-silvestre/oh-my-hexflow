concern = "style"
variant = "format"
blocking = true
run = ["env", "-u", "RUSTFLAGS", "-u", "RUSTC_WRAPPER", "-u", "RUSTC_WORKSPACE_WRAPPER", "-u", "CARGO_ENCODED_RUSTFLAGS", "-u", "CARGO_BUILD_RUSTFLAGS", "cargo", "fmt", "--all", "--", "--check"]
timeout_secs = 120
expect = [{ exit = 0, outcome = "passed" }]
when = { event = "before-commit" }
