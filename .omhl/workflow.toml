version = 1

[native]
checks = ["checks.ci-green-before-merge", "checks.verify-review-comment-anchoring", "checks.config-loosening-review"]

[branch]
integration = "develop"

[[branch.exception]]
pattern = "develop"
mode = "dry-run-with-mark"

[git]
hooks = true

[creation_gate]
enabled = true

[provider]
name = "github"
require_ci = true
