concern = "test"
variant = "suite"
blocking = true
after = ["checks.compile-build"]
run = ["env", "-u", "RUSTFLAGS", "-u", "RUSTC_WRAPPER", "-u", "RUSTC_WORKSPACE_WRAPPER", "-u", "CARGO_ENCODED_RUSTFLAGS", "-u", "CARGO_BUILD_RUSTFLAGS", "TMPDIR=/dev/shm", "cargo", "test", "--workspace", "--lib", "--profile", "checks", "--locked", "--", "--test-threads=4"]
timeout_secs = 120
expect = [{ exit = 0, outcome = "passed" }]
when = { event = "before-push" }
