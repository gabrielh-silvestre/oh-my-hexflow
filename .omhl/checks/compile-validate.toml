concern = "compile"
variant = "validate"
blocking = true
run = ["env", "-u", "RUSTFLAGS", "-u", "RUSTC_WRAPPER", "-u", "RUSTC_WORKSPACE_WRAPPER", "-u", "CARGO_ENCODED_RUSTFLAGS", "-u", "CARGO_BUILD_RUSTFLAGS", "cargo", "check", "--workspace", "--all-targets", "--profile", "checks", "--locked"]
timeout_secs = 89
expect = [{ exit = 0, outcome = "passed" }]
when = { event = "before-push" }
