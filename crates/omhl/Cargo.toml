[package]
name = "omhl"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hexlog = { path = "../hexlog" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde"] }
uuid = { version = "=1.29.1", features = ["v7"] }
tempfile = "=3.27.0"
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
tempfile = "=3.27.0"
